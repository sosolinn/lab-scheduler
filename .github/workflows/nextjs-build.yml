name: Next.js Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate browser scripts
        run: |
          node --check script.js
          node --check database-bridge.js
          node --check duty-database-bridge.js
          node --check people-picker.js
          node --check booking-people.js
          node --check duty-people.js
          node --check duty-rules.js

      - name: Build Next.js application
        run: npm run build
